name: CI

on:
  push:
    branches: [main]
  pull_request:

# Zero-bug deployment gate: nothing merges or deploys unless these pass.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc -b --noEmit

      - name: Lint
        run: bun run lint
